# vllm serve 인자 (1:1 매핑).
# None/null은 스킵, bool true는 플래그만, false는 스킵, list는 반복, dict는 JSON 문자열.
model: ./models/qwen3.5-27b
served_model_name: qwen3.5-27b
host: 127.0.0.1
port: 8000
dtype: bfloat16
max_model_len: 50000
gpu_memory_utilization: 0.90
tensor_parallel_size: 1
trust_remote_code: true
limit_mm_per_prompt:
  image: 16
enforce_eager: false

# vllm 신규 플래그 대응용 탈출구. argv 말미에 그대로 append.
extra_args: []

# vllm-server 자체 설정 (vllm에 넘기지 않음).
startup_timeout_sec: 900
shutdown_grace_sec: 30
health_poll_interval_sec: 2
