[project]
name = "vllm-auto"
version = "0.1.0"
description = "사내 GX10용 Qwen vLLM 서빙 자동화 모노레포"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "python-multipart>=0.0.20,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
vllm-server = "vllm_server.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/vllm_server"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
